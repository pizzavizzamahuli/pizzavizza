<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Vizza — Offline</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .container { max-width: 36rem; padding: 2rem; background: white; border: 1px solid #e5e7eb; border-radius: 1rem; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08); }
      h1 { margin: 0 0 1rem; font-size: 2rem; color: #111827; }
      p { margin: 0.75rem 0; line-height: 1.75; color: #475569; }
      .button { display: inline-block; margin-top: 1.5rem; padding: 0.85rem 1.4rem; background: #f59e0b; color: white; text-decoration: none; border-radius: 999px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>You're offline</h1>
      <p>Some Pizza Vizza features require an internet connection.</p>
      <p>Please reconnect and try again. Refresh when you're back online.</p>
      <a class="button" href="/">Go back to home</a>
    </main>
  </body>
</html>
